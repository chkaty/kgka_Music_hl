workflows:
  ios-build:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Build iOS
        script: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Create IPA
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r Runner_unsigned.ipa Payload
          rm -rf Payload

    artifacts:
      - Runner_unsigned.ipa
